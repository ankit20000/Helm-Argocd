apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp-deployment
  namespace: dev-t
  labels:
    app: myapp
spec:
  replicas: 2   # 2 pods
  selector:
    matchLabels:
      app: myapp
  template:
    metadata:
      labels:
        app: myapp
    spec:
      containers:
        - name: myapp-container
          image: nginx:latest   # you can change this to your app image
          ports:
            - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: myapp-service
  namespace: dev-t
spec:
  selector:
    app: myapp
  ports:
    - protocol: TCP
      port: 80        # Service port
      targetPort: 80  # Container port
  type: ClusterIP    # Can change to NodePort/LoadBalancer if needed

